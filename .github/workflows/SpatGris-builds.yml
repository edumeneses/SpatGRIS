name: SpatGRIS CI

# Linux-only compile test for this fork. The macOS and Windows jobs from
# upstream were removed: this fork targets the SAT dome (Linux/PipeWire), and
# those jobs depend on Apple signing/notarisation secrets that do not exist here,
# so they failed on every push.
#
# This workflow only proves the tree compiles. The redistributable bundle is
# built and published by linux-rolling-release.yml.

on:
  workflow_dispatch: # lets you run a build from the UI
  push:
  pull_request:

# When pushing new commits, cancel any running builds on that branch
concurrency:
  group: spatgris-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JUCE_DIR: submodules/AlgoGRIS/submodules/StructGRIS/submodules/JUCE
  SAF_DIR: submodules/AlgoGRIS/submodules/Spatial_Audio_Framework

jobs:
  build:
    name: ${{ matrix.name }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04 x86_64
            runner: ubuntu-24.04
          - name: Ubuntu 24.04 arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out repository code with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # JUCE Linux deps (JUCE/docs/Linux Dependencies.md), plus cmake/ninja and
      # openblas/lapacke/fftw for SAF, plus clang — see the two notes below.
      - name: Install dependencies
        run: |
          export TZ=Etc/UTC
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git \
            ladspa-sdk freeglut3-dev libasound2-dev libcurl4-openssl-dev libfreetype6-dev \
            libxcomposite-dev libxcursor-dev libxinerama-dev libxrandr-dev mesa-common-dev \
            libjack-jackd2-dev libfontconfig1-dev libx11-dev libxext-dev libxrender-dev \
            libwebkit2gtk-4.1-dev libglu1-mesa-dev libnuma-dev \
            libopenblas-dev liblapacke-dev libfftw3-dev \
            clang

      # SpatGRIS.jucer hardcodes headerPath=/usr/include/openblas (Fedora/Arch
      # layout) and links -lcblas -llapacke; Debian/Ubuntu place these elsewhere.
      - name: Normalise BLAS/LAPACK layout
        run: |
          set -eux
          CBLAS_H="$(find /usr/include -name cblas.h -print -quit)"
          test -n "$CBLAS_H"
          sudo mkdir -p /usr/include/openblas
          sudo ln -sf "$(dirname "$CBLAS_H")"/*.h /usr/include/openblas/
          LIBDIR="/usr/lib/$(gcc -dumpmachine)"
          [ -e "$LIBDIR/libcblas.so" ]   || sudo ln -sf "$LIBDIR/libopenblas.so" "$LIBDIR/libcblas.so"
          [ -e "$LIBDIR/liblapacke.so" ] || sudo ln -sf "$LIBDIR/libopenblas.so" "$LIBDIR/liblapacke.so"

      # SAF's SIMD path is x86-only: with SAF_ENABLE_SIMD set, saf_externals.h
      # hard-errors with "SAF_ENABLE_SIMD requires at least SSE, SSE2 and SSE3
      # support". SpatGRIS.jucer nevertheless puts SAF_ENABLE_SIMD=1 in the Linux
      # exporter's extraDefs unconditionally, so on aarch64 it has to come out of
      # both the SAF build and the .jucer, or the app hits the same #error.
      - name: Match SAF SIMD to the target architecture
        run: |
          set -eux
          if [ "$(uname -m)" = "x86_64" ]; then
            echo "SAF_SIMD=1" >> "$GITHUB_ENV"
          else
            echo "SAF_SIMD=0" >> "$GITHUB_ENV"
            sed -i 's/&#10;SAF_ENABLE_SIMD=1//' SpatGRIS.jucer
            # Clang on AArch64 rejects -march=native ("unsupported argument");
            # -mcpu=native is the equivalent and is accepted by both compilers.
            sed -i 's/-march=native/-mcpu=native/g' SpatGRIS.jucer
            grep -c "SAF_ENABLE_SIMD" SpatGRIS.jucer || true
          fi

      # README step 2. SpatGRIS.jucer links saf and saf_example_binauraliser_nf,
      # so SAF has to be built before the app will link. Release tree only; the
      # -march=native left in place here is correct, because this is a
      # compile test on the machine that runs it, not a redistributable.
      - name: Build Spatial_Audio_Framework (Release)
        run: |
          set -eux
          bash submodules/AlgoGRIS/build_scripts/_fix_saf_mem_leaks.sh
          cmake -S "$SAF_DIR" -B "$SAF_DIR/build/build-release" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_CXX_EXTENSIONS=OFF \
            -DSAF_PERFORMANCE_LIB=SAF_USE_OPEN_BLAS_AND_LAPACKE \
            -DOPENBLAS_HEADER_PATH=/usr/include/openblas \
            -DSAF_USE_FFTW=1 \
            -DSAF_ENABLE_SIMD="$SAF_SIMD" \
            -DSAF_ENABLE_SOFA_READER_MODULE=1
          cmake --build "$SAF_DIR/build/build-release" --parallel "$(nproc)"

      - name: Build Projucer
        run: make -C "$JUCE_DIR/extras/Projucer/Builds/LinuxMakefile" CONFIG=Release -j"$(nproc)"

      - name: Generate Makefile
        run: |
          "$JUCE_DIR/extras/Projucer/Builds/LinuxMakefile/build/Projucer" --resave SpatGRIS.jucer

      # SpatGRIS.jucer sets recommendedWarnings="LLVM", so Projucer emits
      # Clang-only warning flags (-Wbool-conversion, -Wunused-private-field,
      # -Winconsistent-missing-destructor-override, ...) that GCC rejects.
      - name: Compile SpatGRIS
        run: make -C Builds/LinuxMakefile CONFIG=Release CC=clang CXX=clang++ -j"$(nproc)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SpatGRIS-${{ matrix.runner }}
          path: Builds/LinuxMakefile/build/SpatGRIS*
          if-no-files-found: error
